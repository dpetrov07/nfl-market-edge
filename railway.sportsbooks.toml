[build]
builder = "RAILPACK"

# Required variables: SPORTSBOOK_GAME
# Useful overrides: SPORTSBOOK_SPORT=nfl|ncaaf, SPORTSBOOK_BOOKS=fanduel,betrivers,
# SPORTSBOOK_POLL_SECONDS=30, SPORTSBOOK_OUTPUT_DIR or a mounted Railway volume.
[deploy]
startCommand = "python scripts/collect_live_sportsbook_props.py"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
