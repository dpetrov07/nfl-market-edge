<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760">
<title>Component premium and seller edge</title>
<desc>Seller returns by component-midpoint premium quintile and by premium sign within combo price ranges.</desc>
<rect width="1120" height="760" fill="white"/>
