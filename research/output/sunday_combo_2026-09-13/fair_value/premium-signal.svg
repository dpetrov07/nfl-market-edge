<text x="65.0" y="68.0" font-family="Arial, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#68717c">Price gap = combo price minus the win chance implied by its standalone legs</text>
<text x="65.0" y="110.0" font-family="Arial, sans-serif" font-size="18" text-anchor="start" font-weight="bold" fill="#20252b">Combos grouped from lowest to highest price gap</text>
