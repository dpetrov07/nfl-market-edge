<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="700" viewBox="0 0 1180 700">
<title>Seller edge by combo structure</title>
<desc>Equal-combo and volume-weighted seller returns plus fifth-percentile downside for same-game and cross-game two- and three-leg combos.</desc>
<rect width="1180" height="700" fill="white"/>
