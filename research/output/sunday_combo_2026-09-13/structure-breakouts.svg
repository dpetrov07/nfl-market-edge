<text x="1018.3" y="450.0" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#68717c">+6¢</text>
<text x="267.0" y="131.0" font-family="Arial, sans-serif" font-size="15" text-anchor="end" font-weight="bold" fill="#20252b">Cross-game · 2 legs</text>
