[build]
builder = "RAILPACK"

# Required: KALSHI_API_KEY_ID and KALSHI_PRIVATE_KEY containing the raw PEM.
# Mount a volume and Railway supplies RAILWAY_VOLUME_MOUNT_PATH.
[deploy]
startCommand = "python -m scripts.collect_live_combo_slate --manifest config/sunday_2026-09-27.json"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
