[build]
builder = "RAILPACK"

# Required: SLATE_MANIFEST_JSON, KALSHI_API_KEY_ID, and one KALSHI_PRIVATE_KEY*
# variable. Mount a volume and Railway supplies RAILWAY_VOLUME_MOUNT_PATH.
[deploy]
startCommand = "python -m scripts.collect_live_combo_slate"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
